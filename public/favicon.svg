<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: rounded square with orange gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Motorcycle wheel (outer ring) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#wheel)" stroke-width="4"/>

  <!-- Wheel hub (center) -->
  <circle cx="32" cy="32" r="5" fill="#ffffff"/>

  <!-- Wheel spokes (8 directions) -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="12" x2="32" y2="22"/>
    <line x1="32" y1="42" x2="32" y2="52"/>
    <line x1="12" y1="32" x2="22" y2="32"/>
    <line x1="42" y1="32" x2="52" y2="32"/>
    <line x1="17.9" y1="17.9" x2="24.9" y2="24.9"/>
    <line x1="39.1" y1="39.1" x2="46.1" y2="46.1"/>
    <line x1="46.1" y1="17.9" x2="39.1" y2="24.9"/>
    <line x1="24.9" y1="39.1" x2="17.9" y2="46.1"/>
  </g>

  <!-- Wrench overlay (bottom-right, small) -->
  <g transform="translate(40,40) rotate(45)">
    <rect x="-1.5" y="0" width="3" height="14" fill="#1f2937" rx="1"/>
    <path d="M -4,-2 L 4,-2 L 4,-5 L 2,-5 L 2,-7 L -2,-7 L -2,-5 L -4,-5 Z" fill="#1f2937"/>
  </g>
</svg>
